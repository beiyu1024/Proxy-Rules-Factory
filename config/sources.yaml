# 自动化分流规则工厂配置（五源强强联合终极版）
# 融合 5 大日更活跃社区仓库：
#   1. MetaCubeX/meta-rules-dat      (v2fly + Loyalsoldier + 社区 PR 主干，日更)
#   2. DustinWin/ruleset_geodata     (实战 AI / Netflix IP / Telegram IP / GFW / PT Trackers，日更)
#   3. Loyalsoldier/clash-rules      (GFW / Telegram CIDR 精准校对，日更)
#   4. blackmatrix7/ios_rule_script  (OpenAI 防风控关联域 / Netflix 实测设备域 / Apple OTA / LAN)
#   5. TG-Twilight/AWAvenue-Ads-Rule (秋风极简零误杀全屋去广告，日更)
#
# 顺序即优先级！严格遵循：
#   私有保护 -> 广告/OTA 拦截 -> 细分专项(AI/流媒体/通信/开发学术) -> 大型平台(父域) -> 国内大厂/媒体 -> GFW -> 国内兜底 -> 全球兜底

repo_owner: beiyu1024
repo_name: Proxy-Rules-Factory
repo_branch: main

groups:
  # ==================== 第 1 层：私有与底层最高优先级保护 ====================
  - id: lan
    name: "🏠 局域服务"
    default_target: "🎯 直连服务"
    is_direct_group: true
    custom_key: lan_private
    mrs_geosite: ["private"]
    mrs_geoip: ["private"]
    sources:
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list

  - id: private_direct
    name: "🤓 私人服务"
    default_target: "🎯 直连服务"
    is_direct_group: true
    custom_key: private_direct
    sources: []

  - id: dynamic_direct
    name: "🚁 动态直连"
    default_target: "🎯 直连服务"
    is_direct_group: true
    custom_key: dynamic_direct
    sources: []

  - id: dynamic_proxy
    name: "🚻 动态代理"
    default_target: "☑️ 节点选择"
    custom_key: dynamic_proxy
    sources: []

  - id: foreign_dns
    name: "☎️ 国外-DNS"
    default_target: "🔯 故障转移"
    custom_key: foreign_dns
    sources: []

  # ==================== 第 2 层：轻量去广告 & 系统 OTA 强拦截 ====================
  - id: adblock
    name: "🛡️ 广告拦截"
    default_target: "❌ 拒绝请求"
    mrs_extra_urls:
      - name: "mrs_awavenue_ads"
        behavior: "domain"
        url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs"
    sources:
      - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml

  - id: apple_ota
    name: "⬆️ 苹果升级"
    default_target: "❌ 拒绝请求"
    sources:
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SystemOTA/SystemOTA.list

  # ==================== 第 3 层：高风控 AI 专项（全部在 Google/Microsoft 父域之前） ====================
  - id: ai_openai
    name: "🤖 OpenAI"
    default_target: "☑️ 节点选择"
    mrs_geosite: ["openai"]
    sources:
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list

  - id: ai_gemini
    name: "🤖 Gemini"
    default_target: "☑️ 节点选择"
    mrs_geosite: ["google-gemini"]
    sources:
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google-gemini.list

  - id: ai_other
    name: "🤖 Claude & AI"
    default_target: "☑️ 节点选择"
    mrs_geosite: ["anthropic", "xai", "perplexity", "cursor", "category-ai-!cn"]
    sources:
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/anthropic.list
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/xai.list
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/perplexity.list
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cursor.list
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.list
      - https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ai.list

  - id: ai_copilot
    name: "🤖 微软助手"
    default_target: "☑️ 节点选择"
    custom_key: ai_copilot_extra
    mrs_geosite: ["bing"]
    sources:
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bing.list

